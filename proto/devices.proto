syntax = "proto3";

package santroller;

// Configuration for I2C OLED display peripheral (e.g. SH1106 128x32)
message OledDisplayConfig {
  bool enabled = 1;              // Enable/disable OLED display
  uint32 i2c_bus = 2;            // I2C controller bus index (0 = i2c0, 1 = i2c1)
  uint32 sda_pin = 3;            // GPIO pin for I2C SDA (e.g. GP4)
  uint32 scl_pin = 4;            // GPIO pin for I2C SCL (e.g. GP5)
  uint32 i2c_address = 5;        // I2C slave address (default 0x3C / 60)
  uint32 baudrate = 6;           // Bus frequency in Hz (default 400000)
  uint32 width = 7;              // Display width in pixels (e.g. 128)
  uint32 height = 8;             // Display height in pixels (e.g. 32)
  uint32 contrast = 9;           // Contrast level (0-255)
  bool flip_vertical = 10;       // Rotate display 180 degrees
  uint32 display_timeout_s = 11; // Auto screen-off timeout in seconds (0 = off)
}

// Updated DevicesConfig wrapper message
message DevicesConfig {
  // Existing peripheral fields...
  // uint32 neopixel_count = 1;
  // ...
  
  OledDisplayConfig oled_display = 15; // Added OLED display configuration field
}
